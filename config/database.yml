# One PostgreSQL database per environment. Solid Queue's tables live in the same database
# (db/migrate), so a job is enqueued in the same transaction as the change that caused it.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  url: <%= ENV["DATABASE_URL"] %>

development:
  <<: *default
  database: rehab_aftercare_development

test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL", ENV["DATABASE_URL"]) %>
  database: <%= ENV["TEST_DATABASE_URL"] || ENV["DATABASE_URL"] ? nil : "rehab_aftercare_test" %>

production:
  <<: *default
