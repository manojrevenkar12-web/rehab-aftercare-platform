    kind: closing_report
    facts: { patient: P-B3, programme: T-RENA digital, status: completed, units_required: 18, units_done: 18, first_unit: "2026-03-01",
             last_unit: "2026-05-30", weeks: 13, units_per_week: 1.4, effort_mean: 4.0, check_ins: 0, red_flags_seen: [chest_pain, fall] }
