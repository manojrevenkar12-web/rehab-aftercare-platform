    kind: closing_report
    facts: { patient: P-B2, programme: IRENA digital, status: ended_early, units_required: 24, units_done: 9, first_unit: "2026-06-02",
             last_unit: "2026-07-21", weeks: 7, units_per_week: 1.3, pain_start: 6.0, pain_end: 5.3, pain_change: -0.7, check_ins: 2, red_flags_seen: [], end_reason: patient_withdrew }
