             plan: [{ exercise_key: pelvic_tilt, level: 1, body_region: lumbar, sets: 2, reps: 10, per_week: 3 }],
             recent_units: [{ on: "2026-11-01", pain_before: 4, pain_after: 3, effort: 5 }, { on: "2026-11-05", pain_before: 3, pain_after: 2, effort: 5 }] }
