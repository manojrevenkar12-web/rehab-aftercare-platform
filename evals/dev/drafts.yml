    kind: plan_change
    facts: { patient: P-C2, indication: orthopaedics, context: [orthopaedics],
             plan: [{ exercise_key: mini_squat, level: 2, body_region: knee, sets: 3, reps: 12, per_week: 3 }, { exercise_key: quad_sets, level: 1, body_region: knee, sets: 2, reps: 15, per_week: 5 }],
             recent_units: [{ on: "2026-10-20", pain_before: 3, pain_after: 4, effort: 6 }, { on: "2026-10-24", pain_before: 4, pain_after: 6, effort: 7 }] }
