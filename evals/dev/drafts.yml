# Dev set for the AI workflows: facts as the application builds them (already pseudonymised).
cases:
  - id: reply-de-flags
    kind: check_in_reply
    facts: { patient: P-A1, language: de, programme: T-RENA digital, units_done: 7, units_required: 18, pain_score: 6, previous_pain_score: 3,
             message: "Seit dem Sturz gestern tut der Rücken weh.", red_flags: [{ code: fall, severity: urgent }, { code: pain_jump, severity: urgent }] }
  - id: reply-en-emergency
    kind: check_in_reply
    facts: { patient: P-A2, language: en, programme: IRENA digital, units_done: 12, units_required: 24, pain_score: 3,
             message: "I had chest pain during the walk.", red_flags: [{ code: chest_pain, severity: emergency }] }
  - id: reply-de-calm
    kind: check_in_reply
    facts: { patient: P-A3, language: de, programme: T-RENA digital, units_done: 16, units_required: 18, pain_score: 2, previous_pain_score: 2,
             message: "Alles gut, die Übungen fallen leichter.", red_flags: [] }
