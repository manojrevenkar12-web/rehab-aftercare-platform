    kind: closing_report
    facts: { patient: P-B1, programme: T-RENA digital, status: completed, units_required: 18, units_done: 18, first_unit: "2026-09-10",
             last_unit: "2026-11-19", weeks: 10, units_per_week: 1.8, pain_start: 5.7, pain_end: 2.3, pain_change: -3.4, effort_mean: 5.5, check_ins: 4, red_flags_seen: [fall] }
